<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>VOSCCTV Remote Console</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#EF4444">
  <meta name="color-scheme" content="dark light">
  <script>
    try {
      const theme = localStorage.getItem('voscctv_theme') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
      const meta = document.querySelector('meta[name="color-scheme"]');
      if (meta) meta.content = theme;
    } catch(e) {}
  </script>
  <link rel="stylesheet" href="/css/style.css?v=vosctv15">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Slim VOSCTV Header -->
  <header class="vosctv-bar">
    <div class="bar-left">
      <div class="vosctv-brand">
        <span class="vosctv-title">VOSC<span class="accent">CTV</span></span>
      </div>
    </div>

    <div class="bar-right">
      <div class="user-pill" id="user-pill" title="Active Console Operator">
        <span class="user-name" id="user-name">iot</span>
      </div>
      <button class="tool-btn theme-toggle-btn" id="theme-toggle-btn" onclick="toggleTheme()" title="Switch Light/Dark Mode" aria-label="Toggle theme">
        <span class="theme-label" id="theme-toggle-label">Light</span>
      </button>
      <button class="tool-btn" onclick="reloadActive()" title="Reload live wall">Reload</button>
      <button class="tool-btn" onclick="toggleFullscreen()" title="Toggle Fullscreen">Fullscreen</button>
      <button class="tool-btn logout-btn" id="logout-btn" onclick="handleLogout()" title="Sign out of console">
        <span>Logout</span>
      </button>
    </div>
  </header>

  <!-- Main Viewport -->
  <main class="viewport-area" id="viewport-area" data-view="gpu">
    <!-- GPU Live Wall Session Pane (Dahua-Style Interactive Grid with 100% Client GPU) -->
    <div class="nvr-pane gpu-pane" id="pane-gpu">
      <!-- Left Device & Camera Tree Sidebar (Drawer on <=1024px) -->
      <aside class="gpu-sidebar" id="gpu-sidebar" aria-label="Devices and Cameras">
        <div class="gpu-sidebar-header">
          <div class="gpu-sidebar-title">
            <span>DEVICES & CAMERAS</span>
            <button class="gpu-sidebar-close-btn" onclick="window.VOSCCTV_GPU_WALL.toggleDrawer(false)" title="Close Camera List" aria-label="Close Camera List">✕</button>
          </div>
          <div class="gpu-search-box">
            <input type="text" id="gpu-cam-search" placeholder="Search cameras..." autocomplete="off" spellcheck="false" oninput="window.VOSCCTV_GPU_WALL.filterTree(this.value)">
          </div>
        </div>

        <!-- Camera Tree Container -->
        <div class="gpu-tree-container" id="gpu-tree-container">
          <!-- Populated dynamically: NVR 1 & NVR 2 with clean items (Double-click/Long-press to rename) -->
        </div>

        <!-- Batch Action Footer -->
        <div class="gpu-sidebar-footer">
          <button type="button" class="gpu-tree-action-btn" onclick="window.VOSCCTV_GPU_WALL.openAll('nvr1')">NVR 1 All</button>
          <button type="button" class="gpu-tree-action-btn" onclick="window.VOSCCTV_GPU_WALL.openAll('nvr2')">NVR 2 All</button>
          <button type="button" class="gpu-tree-action-btn danger" onclick="window.VOSCCTV_GPU_WALL.clearAll()">Clear</button>
        </div>
      </aside>

      <!-- Backdrop overlay for mobile drawers (placed after sidebar & above main dock z-index) -->
      <div class="gpu-drawer-backdrop" id="gpu-drawer-backdrop" onclick="window.VOSCCTV_GPU_WALL.closeMobileDrawers()"></div>

      <!-- Central Modifiable Grid Area -->
      <section class="gpu-main-area">
        <!-- Top Control Bar -->
        <div class="gpu-toolbar">
          <div class="gpu-toolbar-left">
            <button class="gpu-drawer-toggle-btn active" id="gpu-drawer-toggle" onclick="window.VOSCCTV_GPU_WALL.toggleDrawer()" title="Toggle Camera List Sidebar" aria-expanded="true">
              <span id="gpu-drawer-toggle-icon">◀</span> <span>Cameras</span>
              <span class="toggle-led-dot"></span>
            </button>

            <!-- SPLIT Dropdown -->
            <div class="gpu-toolbar-group" title="Select Video Grid Split">
              <label for="gpu-split-select" class="gpu-group-label">SPLIT:</label>
              <div class="gpu-select-wrapper">
                <select class="gpu-toolbar-select" id="gpu-split-select" name="split" onchange="window.VOSCCTV_GPU_WALL.setSplit(parseInt(this.value, 10))">
                  <option value="1">1 (Focus)</option>
                  <option value="2">2 (Dual)</option>
                  <option value="4" selected>4 (Quad)</option>
                  <option value="6">6 (3x2)</option>
                  <option value="9">9 (3x3)</option>
                  <option value="16">16 (4x4)</option>
                  <option value="25">25 (5x5)</option>
                  <option value="32">32 (8x4)</option>
                </select>
              </div>
            </div>

            <!-- COLS Dropdown -->
            <div class="gpu-toolbar-group" title="Dynamic Column Layout Mode">
              <label for="gpu-col-select" class="gpu-group-label">COLS:</label>
              <div class="gpu-select-wrapper">
                <select class="gpu-toolbar-select" id="gpu-col-select" name="cols" onchange="window.VOSCCTV_GPU_WALL.setColumnMode(this.value === 'auto' ? 'auto' : parseInt(this.value, 10))">
                  <option value="auto" selected>Auto</option>
                  <option value="1">1 Col</option>
                  <option value="2">2 Cols</option>
                  <option value="3">3 Cols</option>
                  <option value="4">4 Cols</option>
                </select>
              </div>
            </div>

            <!-- SIZE Dropdown -->
            <div class="gpu-toolbar-group" title="Slot Size & Scroll Mode">
              <label for="gpu-size-select" class="gpu-group-label">SIZE:</label>
              <div class="gpu-select-wrapper">
                <select class="gpu-toolbar-select" id="gpu-size-select" name="size" onchange="window.VOSCCTV_GPU_WALL.setSlotSize(this.value)">
                  <option value="large" selected>Large</option>
                  <option value="xl">Extra Large</option>
                  <option value="medium">Medium</option>
                  <option value="fit">Fit Screen</option>
                </select>
              </div>
            </div>

            <!-- STREAM Dropdown -->
            <div class="gpu-toolbar-group" title="Stream Acceleration Engine">
              <label for="gpu-engine-select" class="gpu-group-label">STREAM:</label>
              <div class="gpu-select-wrapper">
                <select class="gpu-toolbar-select" id="gpu-engine-select" name="engine" onchange="window.VOSCCTV_GPU_WALL.setStreamEngine(this.value)">
                  <option value="auto" selected>Auto</option>
                  <option value="mse">MSE</option>
                  <option value="webrtc">WebRTC</option>
                </select>
              </div>
            </div>

            <!-- ASPECT Dropdown -->
            <div class="gpu-toolbar-group" title="Video Aspect Ratio Mode">
              <label for="gpu-aspect-select" class="gpu-group-label">ASPECT:</label>
              <div class="gpu-select-wrapper">
                <select class="gpu-toolbar-select" id="gpu-aspect-select" name="aspect" onchange="window.VOSCCTV_GPU_WALL.setGlobalAspect(this.value)">
                  <option value="contain" selected>Fit (16:9)</option>
                  <option value="fill">Stretch</option>
                  <option value="cover">Crop</option>
                </select>
              </div>
            </div>

            <button class="gpu-tour-btn" id="gpu-tour-btn" onclick="window.VOSCCTV_GPU_WALL.toggleTour()" title="Auto-cycle cameras across slots" aria-pressed="false">
              <span class="toggle-led-dot"></span>
              <span>Tour</span>
            </button>
          </div>

          <div class="gpu-toolbar-right">
            <div class="gpu-toolbar-quick" id="gpu-toolbar-quick" aria-label="Quick batch actions">
              <button type="button" class="gpu-toolbar-action-btn" onclick="window.VOSCCTV_GPU_WALL.openAll('nvr1')" title="Load all NVR 1 cameras into grid">NVR 1 All</button>
              <button type="button" class="gpu-toolbar-action-btn" onclick="window.VOSCCTV_GPU_WALL.openAll('nvr2')" title="Load all NVR 2 cameras into grid">NVR 2 All</button>
              <button type="button" class="gpu-toolbar-action-btn danger" onclick="window.VOSCCTV_GPU_WALL.clearAll()" title="Clear all grid slots">Clear</button>
            </div>

            <div class="gpu-toolbar-group gpu-view-dropdown-wrap" title="Saved View Presets">
              <label for="gpu-view-select" class="gpu-group-label">VIEW:</label>
              <div class="gpu-select-wrapper">
                <select class="gpu-toolbar-select gpu-view-select" id="gpu-view-select" name="view" onchange="window.VOSCCTV_GPU_WALL.loadViewPreset(this.value)">
                  <option value="default">Default</option>
                </select>
              </div>
              <button class="gpu-view-save-btn" onclick="window.VOSCCTV_GPU_WALL.saveCurrentViewPreset()" title="Save current camera arrangement">Save</button>
            </div>
          </div>
        </div>

        <!-- Central Modifiable Grid Container (100% Unobstructed Video) -->
        <div class="gpu-grid-container" id="gpu-grid-container">
          <!-- Dynamic slots 1..32 with active selection and VideoRTC players -->
        </div>

        <!-- Dedicated Bottom Control Dock (Dahua VMS Architecture: OUTSIDE Video) -->
        <div class="gpu-dock-bar" id="gpu-dock-bar">
          <div class="gpu-dock-left">
            <button type="button" class="gpu-dock-cam-trigger" id="dock-btn-cameras" onclick="window.VOSCCTV_GPU_WALL.toggleDrawer()" title="Open Cameras List" aria-label="Open Cameras List">Cameras</button>
            <div class="gpu-dock-slot-group">
              <button type="button" class="gpu-dock-slot-nav" id="dock-slot-prev" onclick="window.VOSCCTV_GPU_WALL.stepSelectedSlot(-1)" title="Previous Slot" aria-label="Previous Slot">◀</button>
              <button type="button" class="gpu-dock-slot-pill" id="gpu-dock-slot-pill" onclick="window.VOSCCTV_GPU_WALL.cycleSelectedSlot()" title="Tap to select next grid slot">Slot 1</button>
              <button type="button" class="gpu-dock-slot-nav" id="dock-slot-next" onclick="window.VOSCCTV_GPU_WALL.stepSelectedSlot(1)" title="Next Slot" aria-label="Next Slot">▶</button>
            </div>
            <span class="gpu-dock-cam-title" id="gpu-dock-cam-title">No Camera Assigned</span>
          </div>

          <div class="gpu-dock-center">
            <button class="gpu-dock-btn" id="dock-btn-1x1" onclick="window.VOSCCTV_GPU_WALL.dockToggleZoom1x1()" title="Toggle 1x1 Full Screen View" aria-pressed="false">
              <span class="dock-btn-label">1x1</span>
            </button>
            <button type="button" class="gpu-dock-btn" id="dock-btn-quality" onclick="window.VOSCCTV_GPU_WALL.dockToggleQuality()" title="Toggle Main HD / Sub-Stream" aria-pressed="false">
              <span class="dock-btn-label" id="dock-quality-label">SUB</span>
            </button>
            <button type="button" class="gpu-dock-btn" id="dock-btn-zoom" onclick="window.VOSCCTV_GPU_WALL.dockToggleDigitalZoom()" title="Digital Zoom (Tap +/- or pinch/wheel to zoom, drag to pan)" aria-pressed="false">
              <span class="dock-btn-label" id="dock-zoom-label">Zoom</span>
            </button>
            <button type="button" class="gpu-dock-btn dock-zoom-step hidden" id="dock-btn-zoom-out" onclick="window.VOSCCTV_GPU_WALL.dockStepDigitalZoom(-0.5)" title="Zoom Out (-0.5x)" aria-label="Digital zoom out">
              <span class="dock-btn-label">-</span>
            </button>
            <button type="button" class="gpu-dock-btn dock-zoom-step hidden" id="dock-btn-zoom-in" onclick="window.VOSCCTV_GPU_WALL.dockStepDigitalZoom(0.5)" title="Zoom In (+0.5x)" aria-label="Digital zoom in">
              <span class="dock-btn-label">+</span>
            </button>
            <button class="gpu-dock-btn" id="dock-btn-snapshot" onclick="window.VOSCCTV_GPU_WALL.dockTakeSnapshot()" title="Capture High-Res Snapshot">
              <span class="dock-btn-label">Snapshot</span>
            </button>
            <button class="gpu-dock-btn" id="dock-btn-audio" onclick="window.VOSCCTV_GPU_WALL.dockToggleAudio()" title="Listen to Live Audio" aria-pressed="false">
              <span class="dock-btn-label" id="dock-audio-label">Audio</span>
            </button>
            <button class="gpu-dock-btn" id="dock-btn-record" onclick="window.VOSCCTV_GPU_WALL.dockToggleRecord()" title="Record Video Clip to PC" aria-pressed="false">
              <span class="dock-btn-label" id="dock-rec-label">Record</span>
            </button>
            <button type="button" class="gpu-dock-btn" id="dock-btn-aspect" onclick="window.VOSCCTV_GPU_WALL.dockCycleAspect()" title="Cycle Aspect: Fit / Stretch / Crop">
              <span class="dock-btn-label" id="dock-aspect-label">FIT</span>
            </button>
            <button class="gpu-dock-btn" id="dock-btn-ptz" onclick="window.VOSCCTV_GPU_WALL.dockTogglePtz()" title="Open Dahua PTZ Camera Controls" aria-expanded="false">
              <span class="dock-btn-label">PTZ</span>
            </button>
            <button class="gpu-dock-btn danger" id="dock-btn-close" onclick="window.VOSCCTV_GPU_WALL.dockClearSlot()" title="Close Active Camera Feed">
              <span class="dock-btn-label">Close</span>
            </button>
          </div>
        </div>

        <!-- Custom VMS Right-Click Context Menu -->
        <div class="gpu-context-menu hidden" id="gpu-context-menu">
          <div class="gpu-menu-item" data-menu="1x1" onclick="window.VOSCCTV_GPU_WALL.dockToggleZoom1x1()">Toggle 1x1 Focus</div>
          <div class="gpu-menu-item" data-menu="quality" onclick="window.VOSCCTV_GPU_WALL.dockToggleQuality()">Toggle HD / Sub-Stream</div>
          <div class="gpu-menu-item" data-menu="zoom" onclick="window.VOSCCTV_GPU_WALL.dockToggleDigitalZoom()">Digital Zoom</div>
          <div class="gpu-menu-item" data-menu="snap" onclick="window.VOSCCTV_GPU_WALL.dockTakeSnapshot()">Take Snapshot</div>
          <div class="gpu-menu-item" data-menu="audio" onclick="window.VOSCCTV_GPU_WALL.dockToggleAudio()">Toggle Audio</div>
          <div class="gpu-menu-item" data-menu="rec" onclick="window.VOSCCTV_GPU_WALL.dockToggleRecord()">Record Clip</div>
          <div class="gpu-menu-item" data-menu="aspect" onclick="window.VOSCCTV_GPU_WALL.dockCycleAspect()">Cycle Aspect Ratio</div>
          <div class="gpu-menu-item" data-menu="ptz" onclick="window.VOSCCTV_GPU_WALL.dockTogglePtz()">PTZ Controller</div>
          <div class="gpu-menu-sep"></div>
          <div class="gpu-menu-item danger" data-menu="close" onclick="window.VOSCCTV_GPU_WALL.dockClearSlot()">Close Camera Feed</div>
        </div>
      </section>

      <!-- Right Column: Dedicated PTZ Side Flyout (Docked 3-Column UI on Desktop) -->
      <aside class="gpu-ptz-drawer hidden" id="gpu-ptz-drawer">
        <div class="gpu-ptz-drawer-header">
          <span id="gpu-ptz-drawer-title">PTZ CONTROLLER</span>
          <button class="gpu-ptz-drawer-close" onclick="window.VOSCCTV_GPU_WALL.dockTogglePtz(false)" title="Close PTZ Controller" aria-label="Close PTZ Controller">✕</button>
        </div>
        <div class="gpu-ptz-drawer-body">
          <div class="gpu-ptz-dpad">
            <button class="ptz-btn" data-code="LeftUp">↖</button>
            <button class="ptz-btn" data-code="Up">▲</button>
            <button class="ptz-btn" data-code="RightUp">↗</button>
            <button class="ptz-btn" data-code="Left">◀</button>
            <div class="ptz-center">PTZ</div>
            <button class="ptz-btn" data-code="Right">▶</button>
            <button class="ptz-btn" data-code="LeftDown">↙</button>
            <button class="ptz-btn" data-code="Down">▼</button>
            <button class="ptz-btn" data-code="RightDown">↘</button>
          </div>
          <div class="gpu-ptz-zoom-ctrls">
            <button class="ptz-zoom-btn" data-code="ZoomTele">Zoom +</button>
            <button class="ptz-zoom-btn" data-code="ZoomWide">Zoom -</button>
          </div>
          <div class="gpu-ptz-presets">
            <span>Preset:</span>
            <button class="ptz-preset-btn" onclick="window.VOSCCTV_GPU_WALL.ptzGotoPreset(1)">1</button>
            <button class="ptz-preset-btn" onclick="window.VOSCCTV_GPU_WALL.ptzGotoPreset(2)">2</button>
            <button class="ptz-preset-btn" onclick="window.VOSCCTV_GPU_WALL.ptzGotoPreset(3)">3</button>
            <button class="ptz-preset-btn" onclick="window.VOSCCTV_GPU_WALL.ptzGotoPreset(4)">4</button>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <!-- View Presets Manager Modal / Mobile Bottom Sheet -->
  <dialog class="gpu-preset-dialog" id="gpu-preset-dialog" aria-labelledby="gpu-preset-dialog-title">
    <div class="gpu-preset-dialog-content">
      <div class="gpu-preset-dialog-header">
        <span class="gpu-preset-dialog-title" id="gpu-preset-dialog-title">Layout Presets</span>
        <button type="button" class="gpu-preset-dialog-close" onclick="window.VOSCCTV_GPU_WALL.closePresetDialog()" title="Close dialog" aria-label="Close dialog">✕</button>
      </div>
      <div class="gpu-preset-dialog-body">
        <label for="gpu-preset-name-input" class="gpu-preset-label">Save Current Layout</label>
        <div class="gpu-preset-input-row">
          <input type="text" id="gpu-preset-name-input" class="gpu-preset-input" placeholder="Layout name (e.g. Front Gate & Lobby)" maxlength="32" autocomplete="off">
          <button type="button" class="gpu-preset-btn primary" onclick="window.VOSCCTV_GPU_WALL.confirmSavePreset()">Save</button>
        </div>
        <div class="gpu-preset-list-wrap">
          <span class="gpu-preset-subheading">Saved Layouts</span>
          <div class="gpu-preset-list" id="gpu-preset-list">
            <!-- Dynamically populated presets with Load & Delete actions -->
          </div>
        </div>
      </div>
    </div>
  </dialog>

  <script src="/js/video-rtc.js?v=vosctv1"></script>
  <script src="/js/gpu-wall.js?v=vosctv11"></script>
  <script src="/js/app.js?v=vosctv12"></script>
</body>
</html>
