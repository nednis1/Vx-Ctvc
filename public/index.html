<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOSCCTV Remote Console</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#EF4444">
  <link rel="stylesheet" href="/css/style.css?v=vosctv7">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Slim VOSCTV Header with Session Tabs -->
  <header class="vosctv-bar">
    <div class="bar-left">
      <div class="vosctv-brand">
        <span class="vosctv-title">VOSC<span class="accent">CTV</span></span>
      </div>

      <nav class="session-tabs">
        <button class="session-tab active" id="tab-nvr1" onclick="switchTab('nvr1')">
          <span class="dot online" id="dot-nvr1" title="Online"></span>
          <span>NVR 1 (192.168.1.200)</span>
        </button>

        <button class="session-tab" id="tab-nvr2" onclick="switchTab('nvr2')">
          <span class="dot online" id="dot-nvr2" title="Online"></span>
          <span>NVR 2 (192.168.1.181)</span>
        </button>

        <button class="session-tab" id="tab-split" onclick="switchTab('split')">
          <span class="split-icon">⬚⬚</span>
          <span>Split View</span>
        </button>

        <button class="session-tab" id="tab-gpu" onclick="switchTab('gpu')">
          <span class="gpu-badge">GPU</span>
          <span>Live Wall (GPU)</span>
        </button>
      </nav>
    </div>

    <div class="bar-right">
      <button class="tool-btn" onclick="openDirectTab()" title="Open active NVR in direct browser tab">↗ Direct Tab</button>
      <button class="tool-btn" onclick="reloadActive()" title="Reload active session">↻ Reload</button>
      <button class="tool-btn" onclick="toggleFullscreen()" title="Toggle Fullscreen">⛶ Fullscreen</button>
    </div>
  </header>

  <!-- Main Viewports (Shared Persistent NVR Sessions Across Single & Split Views) -->
  <main class="viewport-area" id="viewport-area" data-view="nvr1">
    <!-- NVR 1 Session Pane -->
    <div class="nvr-pane" id="pane-nvr1">
      <div class="split-title">NVR 1 (192.168.1.200)</div>

      <!-- Simple Loading / Timeout Overlay -->
      <div class="nvr-overlay" id="overlay-nvr1">
        <div class="simple-loading" id="card-loading-nvr1">
          <div class="simple-spinner"></div>
          <span class="simple-text" id="title-nvr1">Connecting to NVR 1...</span>
        </div>

        <div class="simple-timeout" id="card-timeout-nvr1" style="display: none;">
          <span class="simple-timeout-msg">Connection timed out</span>
          <button class="simple-retry-btn" onclick="retryPane('nvr1')">↻ Retry</button>
        </div>
      </div>

      <iframe id="frame-nvr1" class="nvr-frame" allow="autoplay; fullscreen; clipboard-read; clipboard-write; camera; microphone"></iframe>
    </div>

    <!-- NVR 2 Session Pane -->
    <div class="nvr-pane" id="pane-nvr2">
      <div class="split-title">NVR 2 (192.168.1.181)</div>

      <!-- Simple Loading / Timeout Overlay -->
      <div class="nvr-overlay" id="overlay-nvr2">
        <div class="simple-loading" id="card-loading-nvr2">
          <div class="simple-spinner"></div>
          <span class="simple-text" id="title-nvr2">Connecting to NVR 2...</span>
        </div>

        <div class="simple-timeout" id="card-timeout-nvr2" style="display: none;">
          <span class="simple-timeout-msg">Connection timed out</span>
          <button class="simple-retry-btn" onclick="retryPane('nvr2')">↻ Retry</button>
        </div>
      </div>

      <iframe id="frame-nvr2" class="nvr-frame" allow="autoplay; fullscreen; clipboard-read; clipboard-write; camera; microphone"></iframe>
    </div>

    <!-- GPU Live Wall Session Pane (100% Client GPU Hardware Accelerated) -->
    <div class="nvr-pane gpu-pane" id="pane-gpu">
      <div class="gpu-header-bar">
        <div class="gpu-bar-left">
          <div class="gpu-control-group">
            <span class="gpu-group-label">NVR SOURCE:</span>
            <button class="gpu-btn gpu-source-btn active" data-nvr="nvr1" onclick="window.VOSCCTV_GPU_WALL.setNvr('nvr1')">NVR 1 (1–32)</button>
            <button class="gpu-btn gpu-source-btn" data-nvr="nvr2" onclick="window.VOSCCTV_GPU_WALL.setNvr('nvr2')">NVR 2 (1–32)</button>
            <button class="gpu-btn gpu-source-btn" data-nvr="both" onclick="window.VOSCCTV_GPU_WALL.setNvr('both')">Dual (Both)</button>
          </div>

          <div class="gpu-control-group">
            <span class="gpu-group-label">GRID:</span>
            <button class="gpu-btn gpu-split-btn" data-split="1" onclick="window.VOSCCTV_GPU_WALL.setSplit(1)">1x1</button>
            <button class="gpu-btn gpu-split-btn active" data-split="4" onclick="window.VOSCCTV_GPU_WALL.setSplit(4)">2x2 (4)</button>
            <button class="gpu-btn gpu-split-btn" data-split="9" onclick="window.VOSCCTV_GPU_WALL.setSplit(9)">3x3 (9)</button>
            <button class="gpu-btn gpu-split-btn" data-split="16" onclick="window.VOSCCTV_GPU_WALL.setSplit(16)">4x4 (16)</button>
          </div>
        </div>

        <div class="gpu-bar-right">
          <div class="gpu-control-group gpu-pager">
            <button class="gpu-btn gpu-pager-btn" onclick="window.VOSCCTV_GPU_WALL.prevPage()" title="Previous Channels">◀</button>
            <span class="gpu-page-text" id="gpu-page-indicator">Channels 1–4 of 32</span>
            <button class="gpu-btn gpu-pager-btn" onclick="window.VOSCCTV_GPU_WALL.nextPage()" title="Next Channels">▶</button>
          </div>

          <div class="gpu-badge-indicator">
            <span class="dot online"></span>
            <span>CLIENT GPU ACCELERATED</span>
          </div>
        </div>
      </div>

      <!-- Dynamic Camera Grid Container -->
      <div class="gpu-grid-container" id="gpu-grid-container"></div>
    </div>
  </main>

  <script src="/js/video-rtc.js?v=vosctv1"></script>
  <script src="/js/gpu-wall.js?v=vosctv2"></script>
  <script src="/js/app.js?v=vosctv9"></script>
</body>
</html>
